[package]
name = "jive"
version = "0.1.0"
edition = "2024"

[dependencies]
# Standard TUI core and shell control
ratatui = "0.30.2"

# Internal Workspace dependency mapping
lib = { path = "../lib" }

# Asynchronous background loop runner for the J REPL pipe
tokio = { version = "1.0", features = ["full"] }
